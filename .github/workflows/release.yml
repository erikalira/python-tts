name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semantic tag to release, for example v1.2.3"
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Both platforms must publish for a release to be considered successful:
  # amd64 serves the existing Docker/Compose deploys, arm64 serves OCI Ampere A1.
  RELEASE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            espeak-ng \
            ffmpeg

      - name: Install dependencies
        run: |
          uv sync --locked --group test --group security

      - name: Run release validation
        env:
          CI: true
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest tests/unit tests/smoke --tb=short -v

      - name: Audit release dependencies
        run: |
          # PYSEC-2026-2132 (click < 8.3.3) is accepted, not ignored silently.
          # gtts 2.5.4 — the latest release — pins click<8.2, so no resolvable
          # upgrade exists. The flaw is in click.edit(), which opens an
          # interactive editor: this project never imports click, and gtts only
          # uses it in its own CLI, which the bot does not invoke.
          # Re-evaluate when gtts relaxes the constraint, then drop this flag.
          uv run pip-audit --ignore-vuln PYSEC-2026-2132 -r requirements.txt
          uv run pip-audit --ignore-vuln PYSEC-2026-2132 -r requirements-test.txt

  publish-bot-image:
    name: Publish Bot Image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.image_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "version=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_name=ghcr.io/${owner}/tts-hotkey-windows-bot" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ steps.image.outputs.image_name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(steps.version.outputs.version, 'v') }}
          labels: |
            org.opencontainers.image.title=tts-hotkey-windows-bot
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.RELEASE_PLATFORMS }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify multi-architecture manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          manifest="$(docker buildx imagetools inspect --raw "${IMAGE_DIGEST}")"

          missing=0
          for platform in ${RELEASE_PLATFORMS//,/ }; do
            os="${platform%%/*}"
            arch="${platform##*/}"
            if printf '%s' "${manifest}" \
              | jq -e --arg os "${os}" --arg arch "${arch}" \
                '[.manifests[]? | select(.platform.os == $os and .platform.architecture == $arch)] | length > 0' \
                >/dev/null; then
              echo "Found platform ${platform} in the published manifest."
            else
              echo "::error::Published manifest is missing platform ${platform}."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "::error::Release aborted: the GHCR artifact is not a complete multi-platform manifest."
            printf '%s\n' "${manifest}"
            exit 1
          fi

      - name: Scan published image for critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.image.outputs.image_name }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          cache: "false"
          version: v0.69.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image with Cosign keyless
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_DIGEST: ${{ steps.image.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_DIGEST}"

      - name: Generate GitHub build provenance attestation
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub Release
    needs: publish-bot-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish-bot-image.outputs.version }}
          BOT_IMAGE: ${{ needs.publish-bot-image.outputs.image }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            generated_notes="$(gh release view "$RELEASE_TAG" --json body -q .body)"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
            generated_notes="$(gh release view "$RELEASE_TAG" --json body -q .body)"
          fi

          release_notes_file="$(mktemp)"
          cat > "$release_notes_file" <<EOF
          ## Release Artifacts

          - Bot image: \`${BOT_IMAGE}:${RELEASE_TAG}\`
          - Signed image digest: \`${BOT_IMAGE}@${{ needs.publish-bot-image.outputs.digest }}\`
          - Platforms: \`${RELEASE_PLATFORMS}\`
          - Rollback image tag: record the previous production \`APP_VERSION\` before deploy

          ## Validation

          - Release workflow validation passed before image publish
          - Runtime dependency audit passed before image publish
          - Published manifest was verified to contain every released platform
          - Docker image critical vulnerability scan passed before signing
          - Docker image was signed with Cosign keyless identity
          - Build provenance attestation was pushed to the registry
          - Docker image was built from \`${GITHUB_SHA}\`

          ${generated_notes}
          EOF

          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$release_notes_file"
