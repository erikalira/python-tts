name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - "deploy/k8s/**"
      - "deploy/oci/**"
      - "scripts/deploy/**"
      - "docker-compose*.yml"
      - ".github/workflows/iac.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "deploy/k8s/**"
      - "deploy/oci/**"
      - "scripts/deploy/**"
      - "docker-compose*.yml"
      - ".github/workflows/iac.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    name: OpenTofu validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Check formatting
        run: tofu fmt -check -recursive infra

      - name: Validate environments
        shell: bash
        run: |
          set -euo pipefail
          for environment_dir in infra/environments/*; do
            if [ -d "${environment_dir}" ]; then
              tofu -chdir="${environment_dir}" init -backend=false
              tofu -chdir="${environment_dir}" validate
            fi
          done

      - name: Validate Kustomize overlays
        shell: bash
        run: |
          set -euo pipefail
          for overlay_dir in deploy/k8s/overlays/*; do
            if [ -d "${overlay_dir}" ]; then
              kubectl kustomize "${overlay_dir}" >/dev/null
            fi
          done

      - name: Validate Docker Compose files
        shell: bash
        run: |
          set -euo pipefail

          # Placeholder values only. This checks file structure and variable
          # interpolation, never real credentials.
          compose_env="$(mktemp)"
          cat > "${compose_env}" <<'ENVFILE'
          BOT_IMAGE=ghcr.io/example/tts-hotkey-windows-bot
          APP_VERSION=v0.0.0
          VCS_REF=ci
          DISCORD_TOKEN=placeholder
          BOT_SPEAK_TOKEN=placeholder
          POSTGRES_DB=placeholder
          POSTGRES_USER=placeholder
          POSTGRES_PASSWORD=placeholder
          PUBLIC_HOSTNAME=tts.example.com
          ENVFILE

          docker compose --env-file "${compose_env}" -f docker-compose.prod.yml config >/dev/null
          echo "docker-compose.prod.yml is valid."

          # The OCI compose file expects its runtime layout beside it: a
          # configs directory, the Caddy files, and the runtime env file that
          # the bot service reads through env_file.
          oci_dir="$(mktemp -d)"
          mkdir -p "${oci_dir}/configs" "${oci_dir}/caddy/data" "${oci_dir}/caddy/config"
          cp deploy/vm/Caddyfile "${oci_dir}/caddy/Caddyfile"
          cp "${compose_env}" "${oci_dir}/.env.runtime"

          docker compose --env-file "${compose_env}" --project-directory "${oci_dir}" \
            -f docker-compose.vm.yml config >/dev/null
          docker compose --env-file "${compose_env}" --project-directory "${oci_dir}" \
            -f docker-compose.vm.yml --profile https config >/dev/null
          echo "docker-compose.vm.yml is valid for both profiles."

          # The default deployment has no DNS name and never starts the https
          # profile. Compose interpolates inactive profiles too, so validate
          # without a hostname to keep that path from regressing.
          grep -v '^PUBLIC_HOSTNAME=' "${compose_env}" > "${oci_dir}/.env.runtime"
          docker compose --env-file "${oci_dir}/.env.runtime" --project-directory "${oci_dir}" \
            -f docker-compose.vm.yml config >/dev/null
          echo "docker-compose.vm.yml is valid without a public hostname."

      - name: Validate Caddy reverse proxy configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/deploy/vm/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e PUBLIC_HOSTNAME=tts.example.com \
            -e ACME_EMAIL=ops@example.com \
            -e BOT_HTTP_PORT=10000 \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Lint deployment shell scripts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/mnt" -w /mnt koalaman/shellcheck:stable \
            scripts/deploy/vm-deploy.sh \
            scripts/deploy/vm-bootstrap-env.sh
