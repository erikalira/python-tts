name: Deploy OCI

# Deployment is a separate operation from release. This workflow never builds
# an image: it deploys an already released, signed, multi-arch GHCR tag onto
# the OCI Ampere A1 host. Rolling back is the same workflow with an earlier tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Released semantic tag to deploy, for example v1.2.3"
        required: true
        type: string
      dry_run:
        description: "Validate the release tag and manifest without touching the host"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  # Never let two deploys race for the same single-node host.
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Release To OCI
    runs-on: ubuntu-latest
    environment: oci-production
    steps:
      - name: Validate release tag format
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${RELEASE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${RELEASE_TAG}' is not a semantic release tag such as v1.2.3."
            exit 1
          fi

          if [ "${RELEASE_TAG}" = "latest" ]; then
            echo "::error::Mutable tags are not deployable."
            exit 1
          fi

          echo "Release tag ${RELEASE_TAG} accepted."

      - name: Resolve image name
        id: image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_name=ghcr.io/${owner}/tts-hotkey-windows-bot" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release manifest contains linux/arm64
        env:
          TARGET_IMAGE: ${{ steps.image.outputs.image_name }}:${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if ! manifest="$(docker manifest inspect "${TARGET_IMAGE}" 2>&1)"; then
            echo "::error::Release image not found: ${TARGET_IMAGE}"
            exit 1
          fi

          # The A1 host is ARM64. Deploying a tag without an arm64 entry would
          # fail on the instance instead of here.
          if ! printf '%s' "${manifest}" | jq -e \
            '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length > 0' \
            >/dev/null; then
            echo "::error::${TARGET_IMAGE} has no linux/arm64 manifest entry."
            printf '%s\n' "${manifest}"
            exit 1
          fi

          echo "Confirmed linux/arm64 support for ${TARGET_IMAGE}."

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Dry run: ${RELEASE_TAG} is a valid, arm64-capable release. The host was not modified."

      - name: Configure SSH access
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OCI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY}" ] || [ -z "${DEPLOY_KNOWN_HOSTS}" ]; then
            echo "::error::OCI_DEPLOY_SSH_KEY and OCI_DEPLOY_KNOWN_HOSTS must both be configured."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key

          # Pinned host keys. StrictHostKeyChecking stays enabled so a
          # substituted host cannot receive this deployment.
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release on the OCI host
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APP_DIR: ${{ vars.OCI_APP_DIR || '/opt/python-tts' }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "::error::OCI_DEPLOY_HOST and OCI_DEPLOY_USER must both be configured."
            exit 1
          fi

          # The remote script owns pull, version recording, restart, and
          # health validation. Application secrets already live on the host and
          # are never transmitted by this workflow.
          ssh -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/oci_deploy_key \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "${APP_DIR}/scripts/oci-deploy.sh '${RELEASE_TAG}'"

      - name: Report deployed version
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          # /version and /health come from the running container, so this
          # confirms what is actually serving rather than what was requested.
          deployed="$(ssh -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/oci_deploy_key \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "curl --fail --silent --max-time 10 http://127.0.0.1:10000/health")"

          {
            echo "### OCI deployment"
            echo ""
            echo "- Requested tag: \`${RELEASE_TAG}\`"
            echo "- Health response: \`${deployed}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Deployed ${RELEASE_TAG}; health reported: ${deployed}"

      - name: Remove deployment credentials
        if: always()
        run: |
          rm -f ~/.ssh/oci_deploy_key
